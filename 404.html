<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <style>
        body {
          background: #000019;
          color: darkblue;
          margin: 0;
          font-family: 'Inter', system-ui, -apple-system, sans-serif;
          line-height: 1.6;
          padding: 20px;
          position: relative;
          overflow-y: auto;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          box-sizing: border-box;
        }

        .nav {
          display: flex;
          justify-content: center;
          gap: 10px;
          margin-top: 24px;
        }

        .highlighted-section {
          background-color: rgba(34, 34, 34, 0.85);
          border-left: 4px solid #ffd700;
          padding: 30px;
          max-width: 550px;
          width: 100%;
          border-radius: 8px;
          box-shadow: 0 0 15px rgba(0,0,0,0.5);
          text-align: center;
          box-sizing: border-box;
        }

        h1, h2, h3, h4, body {
          font-family: 'Inter', system-ui, -apple-system, sans-serif;
          color: #ffd700;
        }

        h1 {
          font-size: 3.5rem;
          margin: 0 0 15px 0;
          text-shadow: 2px 2px 6px #ff6347, 0 0 12px #87cefa;
        }

        h2:hover {
          text-shadow: 2px 2px 6px #ff6347, 0 0 12px #87cefa;
          transition: all 0.3s ease-in-out;
        }

        a {
          color: #ffd700;
        }
          
        @keyframes clickGlow {
          0% { text-shadow: 1px 1px 4px #ff4500, 0 0 8px #00f0ff; }
          50% { text-shadow: 1px 1px 8px #ffffff, 0 0 16px #ffffff; }
          100% { text-shadow: 1px 1px 4px #ff4500, 0 0 8px #00f0ff; }
        }

        @keyframes navClickGlow {
          0% { text-shadow: 1px 1px 4px #ff4500, 0 0 8px #00f0ff; }
          50% { text-shadow: 1px 1px 8px #ffffff, 0 0 16px #ffffff; }
          100% { text-shadow: 1px 1px 4px #ff4500, 0 0 8px #00f0ff; }
        }

        a:link,
        a:visited {
          color: #ffd700;
          text-decoration: none;
          text-shadow: 1px 1px 4px #ff4500, 0 0 8px #00f0ff;
          transition: all 0.3s ease-in-out;
          outline: none;
        }

        a:hover,
        a:focus {
          color: #fff3a0;
          text-shadow: 2px 2px 6px #ff6347,
                       0 0 14px #87cefa,
                       0 0 20px #00f0ff;
          outline: none;
        }

        a:active {
          animation: clickGlow 0.6s ease-in-out 1;
        }

        .nav a {
          color: #ffd700;
          text-decoration: none;
          text-shadow: 1px 1px 4px #ff4500, 0 0 8px #00f0ff;
          cursor: pointer;
          transition: all 0.3s ease-in-out;
          outline: none;
          border: 1px solid #ffd700;
          padding: 8px 16px;
          border-radius: 4px;
          background: rgba(255, 215, 0, 0.05);
        }

        .nav a:hover,
        .nav a:focus {
          color: #ffd700;
          text-shadow: 2px 2px 6px #ff6347,
                       0 0 14px #87cefa,
                       0 0 20px #00f0ff;
          background: rgba(255, 215, 0, 0.15);
          box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
          outline: none;
        }

        .nav a:active {
          animation: navClickGlow 0.6s ease-in-out 1;
        }

        #particles-js {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: 0;
          pointer-events: none;
        }

        body > *:not(#particles-js) {
          position: relative;
          z-index: 1;
        }

        p, li {
          text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.6);
          color: #ffd700;
          font-size: 1.1rem;
          margin-bottom: 24px;
        }
    </style>
</head>
<body>

    <!-- Target container for particles background -->
    <div id="particles-js"></div>

    <div class="highlighted-section">
        <h1>ERROR 404</h1>
        <p>Whoops, this page wasn't found! Can you try going to the main page and try again? Alternatively you could submit an issue to make this page.</p>
        
        <div class="nav">
            <a href="/">Main Page</a>
            <a href="https://github.com" target="_blank" rel="noopener noreferrer">Submit an Issue</a>
        </div>
    </div>

</body>
</html>
