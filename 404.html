<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 not found | Aeonovyli's personal website</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon/favicon.ico">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Cormorant+Garamond&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="particles-js"></div>
  <div class="message-box">
      <h1>ERROR 404</h1>
      <p>This page was not found! Try returning to the main page or looking at the github repository. Alternatively you could submit an issue to make this page.</p>
      <div class="nav">
          <a href="/">Main Page</a>
          <a href="https://github.com/aeonovyli/aeonovyli.github.io/issues" target="_blank" rel="noopener noreferrer">Submit an Issue</a>
      </div>
  </div>
  <script>
    particlesJS("particles-js", {
      particles: {
        number: {
          value: 70
        },
        size: {
          value: 2
        },
        move: {
          speed: 0.3,
          direction: "top",
          random: true,
          out_mode: "out"
        },
        opacity: {
          value: 0.3,
          random: true
        },
        color: {
          value: ["#4da6ff", "#ff944d", "#ffffff"]
        },
        line_linked: {
          enable: false
        }
      },
      interactivity: {
        events: {
          onhover: {
            enable: false
          }
        }
      },
      retina_detect: true
    });
  </script>
</body>
</html>
