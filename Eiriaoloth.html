  <script>
const ATTEMPT_COOLDOWN_MS = 12 * 60 * 60 * 1000;
const LAST_ATTEMPT_KEY = 'eiriaoloth_last_attempt';
const DECODER_DISABLED_KEY = 'eiriaoloth_decoder_disabled_until';
const DECODER_COOLDOWN_MS = 1 * 60 * 60 * 1000;

const passwordInput = document.getElementById('password');
const unlockBtn = document.querySelector('.main-btn');
const errorDiv = document.getElementById('error');
const outputDiv = document.getElementById('output');
const downloadBtn = document.getElementById('downloadBtn');
const loaderOverlay = document.getElementById('loader-overlay');
const unlockSection = document.getElementById('unlock-section');

document.getElementById('showPw').addEventListener('change', function () {
  passwordInput.type = this.checked ? 'text' : 'password';
});

function checkDecoderStatus() {
  const disabledUntil = parseInt(localStorage.getItem(DECODER_DISABLED_KEY)) || 0;
  const now = Date.now();
  
  if (now < disabledUntil) {
    const remaining = disabledUntil - now;
    const hours = Math.floor(remaining / (60 * 60 * 1000));
    const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
    unlockSection.style.display = 'none';
    showError(`Decoder disabled. Try again in ${hours}h ${minutes}m.`);
    return false;
  }
  return true;
}

function tryDecrypt() {
  if (!checkDecoderStatus()) {
    return;
  }

  const password = passwordInput.value.trim();
  if (!password) {
    showError('Password cannot be empty.');
    return;
  }

  const now = Date.now();
  const lastAttempt = parseInt(localStorage.getItem(LAST_ATTEMPT_KEY)) || 0;
  if (now - lastAttempt < ATTEMPT_COOLDOWN_MS) {
    const remaining = ATTEMPT_COOLDOWN_MS - (now - lastAttempt);
    const hours = Math.floor(remaining / (60 * 60 * 1000));
    const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
    showError(`Try again in ${hours}h ${minutes}m.`);
    return;
  }

  showLoader(true);
  errorDiv.style.display = 'none';
  outputDiv.style.display = 'none';
  downloadBtn.style.display = 'none';

  setTimeout(() => {
    const userHash = CryptoJS.SHA256(password).toString();

    if (userHash === correctHash) {
      localStorage.setItem(LAST_ATTEMPT_KEY, now.toString());
      showLoader(false);
      outputDiv.textContent = 'Access granted. Download available.';
      outputDiv.style.display = 'block';
      downloadBtn.style.display = 'block';
    } else {
      localStorage.setItem(LAST_ATTEMPT_KEY, now.toString());
      localStorage.setItem(DECODER_DISABLED_KEY, (now + DECODER_COOLDOWN_MS).toString());
      showLoader(false);
      unlockSection.style.display = 'none';
      showError('!ACCESS DENIED: INCORRECT KEY! Decoder disabled for 1 hour.');
    }
  }, 1500);
}

function showError(msg) {
  errorDiv.textContent = msg;
  errorDiv.style.display = 'block';
}

function showLoader(show) {
  loaderOverlay.style.display = show ? 'flex' : 'none';
}

window.addEventListener('load', function() {

});
