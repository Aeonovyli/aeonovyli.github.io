    <script>
        particlesJS("particles-js", {
            particles: {
                number: {
                    value: 150,
                    density: {
                        enable: true,
                        value_area: 800
                    }
                },
                color: {
                    value: ["#ffd700", "#00f0ff", "#ffffff"]
                },
                shape: {
                    type: "circle"
                },
                opacity: {
                    value: 0.5,
                    random: true,
                    anim: {
                        enable: true,
                        speed: 1,
                        opacity_min: 0.1,
                        sync: false
                    }
                },
                size: {
                    value: 2,
                    random: true,
                    anim: {
                        enable: false,
                        speed: 1,
                        size_min: 0.1,
                        sync: false
                    }
                },
                line_linked: {
                    enable: false,
                    distance: 150,
                    color: "#ffffff",
                    opacity: 0.4,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 0.5,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out",
                    bounce: false,
                    attract: {
                        enable: false,
                        rotateX: 600,
                        rotateY: 1200
                    }
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: {
                        enable: false
                    },
                    onclick: {
                        enable: false
                    },
                    resize: true
                },
                modes: {
                    grab: {
                        distance: 400,
                        line_linked: {
                            opacity: 1
                        }
                    },
                    bubble: {
                        distance: 400,
                        size: 40,
                        duration: 2,
                        opacity: 8,
                        speed: 3
                    },
                    repulse: {
                        distance: 200,
                        duration: 0.4
                    },
                    push: {
                        particles_nb: 4
                    },
                    remove: {
                        particles_nb: 2
                    }
                }
            },
            retina_detect: true
        });

        const ATTEMPT_COOLDOWN_MS = 1 * 60 * 60 * 1000;
        const LAST_ATTEMPT_KEY = 'eiriaoloth_last_attempt';
        const DECODER_DISABLED_KEY = 'eiriaoloth_decoder_disabled_until';
        
        const passwordInput = document.getElementById('password');
        const errorDiv = document.getElementById('error');
        const outputDiv = document.getElementById('output');
        const downloadBtn = document.getElementById('downloadBtn');
        const loaderOverlay = document.getElementById('loader-overlay');
        const unlockSection = document.getElementById('unlock-section');
        
        document.getElementById('showPw').addEventListener('change', function () {
            passwordInput.type = this.checked ? 'text' : 'password';
        });
        
        function checkDecoderStatus() {
            const disabledUntil = parseInt(localStorage.getItem(DECODER_DISABLED_KEY)) || 0;
            const now = Date.now();
            
            if (now < disabledUntil) {
                const remaining = disabledUntil - now;
                const hours = Math.floor(remaining / (60 * 60 * 1000));
                const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
                unlockSection.style.display = 'none';
                showError(`Decoder disabled. Try again in ${hours}h ${minutes}m.`);
                return false;
            }
            return true;
        }
        
        async function tryDecrypt() {
            if (!checkDecoderStatus()) {
                return;
            }
            
            const password = passwordInput.value.trim();
            if (!password) {
                showError('Password cannot be empty.');
                return;
            }
            
            const now = Date.now();
            const lastAttempt = parseInt(localStorage.getItem(LAST_ATTEMPT_KEY)) || 0;
            if (now - lastAttempt < ATTEMPT_COOLDOWN_MS) {
                const remaining = ATTEMPT_COOLDOWN_MS - (now - lastAttempt);
                const hours = Math.floor(remaining / (60 * 60 * 1000));
                const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
                showError(`Try again in ${hours}h ${minutes}m.`);
                return;
            }
            
            showLoader(true);
            errorDiv.style.display = 'none';
            outputDiv.style.display = 'none';
            downloadBtn.style.display = 'none';
            
            setTimeout(async () => {
                try {
                    const base64String = document.getElementById('encrypted-data-block').textContent.trim();
                    const combined = base64ToUint8(base64String);
                    
                    if (combined[0] !== 0x53 || combined[1] !== 0x56) throw new Error("Invalid format.");
                    if (combined[2] !== 6) throw new Error("Incorrect version.");
                    
                    const view = new DataView(combined.buffer);
                    const nValue = view.getUint32(4, false);
                    const argonTime = view.getUint32(8, false);
                    
                    const salt = combined.slice(12, 28);
                    const iv = combined.slice(28, 40);
                    const ciphertext = combined.slice(40);
                    
                    const key = await deriveArgonKey(password, salt, nValue, argonTime);
                    const ptBuffer = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
                    
                    localStorage.setItem(LAST_ATTEMPT_KEY, now.toString());
                    showLoader(false);
                    outputDiv.textContent = 'Key correct, download at will.';
                    outputDiv.style.display = 'block';
                    downloadBtn.style.display = 'block';
                } catch (e) {
                    localStorage.setItem(LAST_ATTEMPT_KEY, now.toString());
                    localStorage.setItem(DECODER_DISABLED_KEY, (now + ATTEMPT_COOLDOWN_MS).toString());
                    showLoader(false);
                    unlockSection.style.display = 'none';
                    showError('!ACCESS DENIED: INCORRECT KEY! Decoder disabled for an hour. (This is a security measure against hackers.)');
                }
            }, 1500);
        }
        
        function base64ToUint8(base64) {
            const binary = atob(base64);
            const arr = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
            return arr;
        }
        
        async function deriveArgonKey(pw, salt, nValue, argonTime) {
            const argonResult = await argon2.hash({ pass: pw, salt: salt, time: argonTime, mem: nValue, hashLen: 32, type: argon2.Argon2id });
            return await crypto.subtle.importKey("raw", argonResult.hash, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        }
        
        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }
        
        function showLoader(show) {
            loaderOverlay.style.display = show ? 'flex' : 'none';
        }
        
        window.addEventListener('load', function() {
            checkDecoderStatus();
        });
    </script>
