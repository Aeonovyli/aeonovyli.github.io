  border-color: #ff944d;

  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 0.95rem;

  margin-bottom: 20px;
  color: #ffd700;

.checkbox-label input[type="checkbox"] {
  width: 18px;
  height: 18px;
  margin: 0;
  cursor: pointer;
  accent-color: #00f0ff;
}

.btn-center {
  display: flex;
  justify-content: center;
}

button.main-btn {
  width: 100%;
  max-width: 350px;
  padding: 14px;
  background: rgba(255, 215, 0, 0.1);
  color: #ffd700;
  border: 2px solid #ffd700;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  font-weight: bold;
  text-shadow: 1px 1px 4px #ff4500, 0 0 8px #00f0ff;

@keyframes clickGlow {

  100% { text-shadow: 1px 1px 4px #ff4500, 0 0 8px #00f0ff; }

button.main-btn:active {
  animation: clickGlow 0.6s ease-in-out 1;

button.dl-btn {

  max-width: 350px;

<body>
    <div id="loader-overlay"><div class="spinner"></div><h2 style="margin:0;">Decrypting...</h2></div>

    <div class="box">
        <h2 id="main-title">Eiriaoloth</h2>
        
        <div id="unlock-section">
            <p style="color: #64748b;">Please enter the password to decrypt the document.</p>
            <p style="background: #00000000; padding: 8px; border-radius: 6px; font-size: 0.9em; border: 1px solid #ffd700;"><b>Eiriaoloth.docx</b></p>
            
            <input type="password" id="pw" placeholder="Enter password">
            <label class="checkbox-label">
                <input type="checkbox" id="showPwCheckbox" onchange="togglePassword()"> Show password
            </label>
            
            <div class="btn-center">
                <button class="main-btn" onclick="startUnlock()">Decrypt</button>
            </div>
        </div>

        <div id="error" class="error">Incorrect password or corrupted data!</div>
        <div id="output"></div>
        <img id="preview-img" style="max-width: 100%; border-radius: 8px; margin-top: 15px; display: none;">
        
        <div class="btn-center">
            <button id="downloadBtn" class="dl-btn">Save File</button>
        </div>
    </div>

    <script>
        const type = "file";
        const filename = "Eiriaoloth.docx";
        const MAGIC_BYTES = new Uint8Array([0x53, 0x56]);

        function togglePassword() {
            const el = document.getElementById('pw');
            const cb = document.getElementById('showPwCheckbox');
            el.type = cb.checked ? "text" : "password";
        }

        function base64ToUint8(base64) {
            const binary = atob(base64);
            const arr = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
            return arr;
        }

        async function deriveArgonKey(pw, salt, nValue, argonTime) {
            const argonResult = await argon2.hash({ pass: pw, salt: salt, time: argonTime, mem: nValue, hashLen: 32, type: argon2.Argon2id });
            return await crypto.subtle.importKey("raw", argonResult.hash, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        }

        function startUnlock() {
            document.getElementById('error').style.display = 'none';
            document.getElementById('loader-overlay').style.display = 'flex';
            setTimeout(unlock, 50); 
        }

        async function unlock() {
            const pw = document.getElementById('pw').value;
            const errorEl = document.getElementById('error');
            const outputEl = document.getElementById('output');
            
            if (!pw) { document.getElementById('loader-overlay').style.display = 'none'; return; }

            try {
                const base64String = document.getElementById('encrypted-data-block').textContent.trim();
                const combined = base64ToUint8(base64String); 
                
                if (combined[0] !== MAGIC_BYTES[0] || combined[1] !== MAGIC_BYTES[1]) throw new Error("Invalid format.");
                if (combined[2] !== 6) throw new Error("Incorrect version.");

                const view = new DataView(combined.buffer);
                const nValue = view.getUint32(4, false);
                const argonTime = view.getUint32(8, false);
                
                const salt = combined.slice(12, 28);
                const iv = combined.slice(28, 40);
                const ciphertext = combined.slice(40);

                const key = await deriveArgonKey(pw, salt, nValue, argonTime);
                const ptBuffer = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
                
                document.getElementById('unlock-section').style.display = 'none';
                document.getElementById('main-title').innerText = type === 'text' ? 'Decrypted Message' : 'Decrypted File';
                
                if (type === 'text') {
                    outputEl.innerText = new TextDecoder().decode(ptBuffer);
                    outputEl.style.display = 'block';
                } else {
                    const ext = filename.split('.').pop().toLowerCase();
                    const isImage = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext);
                    
                    let mimeType = "application/octet-stream";
                    if (isImage) mimeType = "image/" + (ext === "jpg" ? "jpeg" : ext);
                    
                    const blob = new Blob([ptBuffer], { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    
                    if (isImage) {
                        const img = document.getElementById('preview-img');
                        img.src = url;
                        img.style.display = 'block';
                    }
                    
                    outputEl.innerHTML = "<b>Successfully decrypted!</b>";
                    outputEl.style.display = 'block';
                    
                    const dlBtn = document.getElementById('downloadBtn');
                    dlBtn.style.display = 'block';
                    dlBtn.onclick = function() {
                        const a = document.createElement("a");
                        a.href = url; a.download = filename;
                        document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    };
                    
                    if (!isImage) dlBtn.click();
                }
            } catch (e) {
                console.error(e);
                errorEl.style.display = 'block';
            } finally {
                document.getElementById('loader-overlay').style.display = 'none';
            }
        }
    </script>
