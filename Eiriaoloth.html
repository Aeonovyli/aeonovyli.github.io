        async function checkAeonovyli() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (!session) return false;
                const user = session.user;
                const userMeta = user.user_metadata;
                const username = userMeta?.user_name || userMeta?.full_name || userMeta?.nickname;
                return username === 'Aeonovyli';
            } catch (error) {
                console.error('Error checking user:', error);
                return false;
            }
        }

        async function fetchPassword() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (!session) return null;
                const { data, error } = await _supabase
                    .from('user_secrets')
                    .select('password')
                    .eq('user_id', session.user.id)
                    .single();
                if (error) return null;
                return data.password;
            } catch (error) {
                console.error('Error fetching password:', error);
                return null;
            }
        }

        function showPasswordPopup(password) {
            const modal = document.createElement('div');
            modal.id = 'password-modal';
            modal.style = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px;';
            const content = document.createElement('div');
            content.style = 'background: white; padding: 20px; border-radius: 10px; max-width: 500px; width: 100%; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);';
            content.innerHTML = `
                <h3 style="margin: 0; color: #1a1a1a;">Password to unlock...</h3>
                <div style="background: #f8fafc; padding: 10px; border-radius: 6px; font-family: monospace; word-break: break-all; border: 1px solid #e2e8f0;">${password}</div>
                <button id="copy-btn" style="background: #10b981; color: white; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-weight: bold;">📋 Copy to Clipboard</button>
                <button id="unlock-btn" style="background: #3b82f6; color: white; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-weight: bold;">🔓 Unlock File Now</button>
            `;
            modal.appendChild(content);
            document.body.appendChild(modal);
            document.getElementById('copy-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(password).then(() => alert('Password copied to clipboard!'));
            });
            document.getElementById('unlock-btn').addEventListener('click', () => {
                document.getElementById('pw').value = password;
                startUnlock();
                modal.remove();
            });
        }

                const ciphertext = combined.slice(40);

                const key = await deriveArgonKey(pw, salt, nValue, argonTime);
                const ptBuffer = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
                
                document.getElementById('unlock-section').style.display = 'none';
                document.getElementById('main-title').innerText = type === 'text' ? 'Uncrypted Message' : 'Eiriaoloth no longer encrypted';
                
                if (type === 'text') {
                    outputEl.innerText = new TextDecoder().decode(ptBuffer);
                    outputEl.style.display = 'block';
                } else {
                    const ext = filename.split('.').pop().toLowerCase();
                    const isImage = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext);
                    
                    let mimeType = "application/octet-stream";
                    if (isImage) mimeType = "image/" + (ext === "jpg" ? "jpeg" : ext);
                    
                    const blob = new Blob([ptBuffer], { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    
                    if (isImage) {
                        const img = document.getElementById('preview-img');
                        img.src = url;
                        img.style.display = 'block';
                    }
                    
                    outputEl.innerHTML = "<b>Successfully decrypted!</b>";
                    outputEl.style.display = 'block';
                    
                    const dlBtn = document.getElementById('downloadBtn');
                    dlBtn.style.display = 'block';
                    dlBtn.onclick = function() {
                        const a = document.createElement("a");
                        a.href = url; a.download = filename;
                        document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    };
                    
                    if (!isImage) dlBtn.click();
                }
            } catch (e) {
                console.error(e);
                errorEl.style.display = 'block';
            } finally {
                document.getElementById('loader-overlay').style.display = 'none';
            }
        }

            const el = document.getElementById('pw');

        }

        function base64ToUint8(base64) {
            const binary = atob(base64);
            const arr = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
            return arr;
        }

        async function deriveArgonKey(pw, salt, nValue, argonTime) {
            const argonResult = await argon2.hash({ pass: pw, salt: salt, time: argonTime, mem: nValue, hashLen: 32, type: argon2.Argon2id });
            return await crypto.subtle.importKey("raw", argonResult.hash, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        }
