<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>

  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon/favicon.ico">
  <link rel="manifest" href="/favicon/site.webmanifest">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Cormorant+Garamond&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <script src="https://keepandroidopen.org/banner.js"></script>

  <link rel="stylesheet" href="/assets/css/style.css" data-style-theme="current">

  <style>
    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    #banner-js {
      position: fixed;
      top: 1;
      left: 0;
      width: 100%;
      height: 1%;
      z-index: 0;
      pointer-events: none;
    }

    body {
      position: relative;
      z-index: 1;
      background: #000019;
      color: #ffd700;
      --theme-text: #f4dcc0;
      --theme-frame: #d9b97a;
      --theme-panel: rgba(20, 20, 20, 0.9);
      --theme-accent: #ffd700;
      transition: background 0.2s ease, color 0.2s ease;
    }

    body[data-theme="background"],
    body[data-theme="background-image"],
    body[data-theme="backgroundpng"],
    body[data-theme="image"],
    body[data-theme="default"] {
      background: url('/assets/background.png') center center / cover no-repeat fixed;
      color: var(--theme-text);
      --theme-text: #f4e9dc;
      --theme-frame: #d8b98b;
      --theme-panel: rgba(10, 10, 10, 0.62);
      --theme-accent: #f4e9dc;
    }

    body[data-theme="background"] *,
    body[data-theme="background-image"] *,
    body[data-theme="backgroundpng"] *,
    body[data-theme="image"] *,
    body[data-theme="default"] * {
      color: var(--theme-text) !important;
      text-shadow: none !important;
      border-color: var(--theme-frame) !important;
    }

    .settings-page {
      max-width: 700px;
      margin: 64px auto;
      padding: 0 20px;
    }

    .settings-panel {
      background: var(--theme-panel);
      border: 1px solid var(--theme-frame);
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.18);
      padding: 30px;
      color: var(--theme-text);
    }

    .settings-panel h1 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: clamp(2rem, 4vw, 2.8rem);
      color: var(--theme-text);
    }

    .settings-description {
      margin-bottom: 28px;
      color: var(--theme-text);
    }

    .settings-form {
      display: grid;
      gap: 16px;
    }

    .setting-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--theme-frame);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      color: var(--theme-text);
    }

    .setting-option input {
      accent-color: var(--theme-frame);
      width: 18px;
      height: 18px;
      margin: 0;
    }
  </style>
</head>

<body>
  <div id="particles-js"></div>

  {{ content }}

  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 150, density: { enable: true, value_area: 800 } },
        color: { value: ["#ffd700", "#00f3ff", "#ffffff"] },
        shape: { type: "circle" },
        opacity: {
          value: 0.5,
          random: true,
          anim: { enable: true, speed: 1, opacity_min: 0.1, sync: false }
        },
        size: {
          value: 2,
          random: true,
          anim: { enable: false, speed: 1, size_min: 0.1, sync: false }
        },
        line_linked: { enable: false, distance: 150, color: "#ffffff", opacity: 0.4, width: 1 },
        move: {
          enable: true,
          speed: 0.5,
          direction: "none",
          random: true,
          straight: false,
          out_mode: "out",
          bounce: false,
          attract: { enable: false, rotateX: 600, rotateY: 1200 }
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: false },
          onclick: { enable: false },
          resize: true
        },
        modes: {
          grab: { distance: 400, line_linked: { opacity: 1 } },
          bubble: { distance: 400, size: 40, duration: 2, opacity: 8, speed: 3 },
          repulse: { distance: 200, duration: 0.4 },
          push: { particles_nb: 4 },
          remove: { particles_nb: 2 }
        }
      },
      retina_detect: true
    });
  </script>

  <script>
    (function () {
      const STORAGE_KEY = "aeonovyli-website-style";
      const themeLink = document.querySelector('link[data-style-theme]');

      function normalizeThemeName(name) {
        if (!name) return "style";
        return name.replace(/\.css$/i, "");
      }

      function readSavedTheme() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return normalizeThemeName(saved || "style");
        } catch (error) {
          return "style";
        }
      }

      function applyTheme(name) {
        const themeName = normalizeThemeName(name);

        if (themeLink) {
          const candidate = "/assets/css/" + themeName + ".css";
          themeLink.href = candidate;
        }

        document.body.setAttribute("data-theme", themeName);

        const isImageTheme = themeName === "background" || themeName === "background-image" || themeName === "backgroundpng" || themeName === "image" || themeName === "default";

        if (isImageTheme) {
          document.body.style.background = "url('/assets/background.png') center center / cover no-repeat fixed";
          document.body.style.backgroundAttachment = "fixed";
          document.body.style.backgroundColor = "#000000";
          document.body.style.color = "#f4e9dc";
          document.body.style.setProperty("--theme-text", "#f4e9dc");
          document.body.style.setProperty("--theme-frame", "#d8b98b");
          document.body.style.setProperty("--theme-panel", "rgba(12, 12, 12, 0.62)");
          document.body.style.setProperty("--theme-accent", "#f4e9dc");
          const particles = document.getElementById("particles-js");
          if (particles) particles.style.display = "none";
        } else {
          document.body.style.background = "#000019";
          document.body.style.backgroundImage = "none";
          document.body.style.backgroundAttachment = "scroll";
          document.body.style.color = "#ffd700";
          document.body.style.setProperty("--theme-text", "#f4dcc0");
          document.body.style.setProperty("--theme-frame", "#d9b97a");
          document.body.style.setProperty("--theme-panel", "rgba(20, 20, 20, 0.9)");
          document.body.style.setProperty("--theme-accent", "#ffd700");
          const particles = document.getElementById("particles-js");
          if (particles) particles.style.display = "block";
        }
      }

      const initialTheme = readSavedTheme();
      applyTheme(initialTheme);

      window.applyTheme = function (name) {
        const themeName = normalizeThemeName(name);
        try {
          localStorage.setItem(STORAGE_KEY, themeName);
        } catch (error) {
        }
        applyTheme(themeName);
      };
    })();
  </script>

  <script>
    (function () {
      const form = document.getElementById("site-style-form");
      if (!form) return;

      function selectedValue() {
        const checked = form.querySelector('input[name="site-style"]:checked');
        return checked ? checked.value : "style";
      }

      function syncSelection() {
        const saved = localStorage.getItem("aeonovyli-website-style") || "style";
        const radio = form.querySelector('input[name="site-style"][value="' + saved + '"]');
        if (radio) radio.checked = true;
      }

      syncSelection();

      form.addEventListener("change", function () {
        const value = selectedValue();
        window.applyTheme(value);
        try {
          localStorage.setItem("aeonovyli-website-style", value);
        } catch (error) {
        }
      });
    })();
  </script>
</body>
</html>
