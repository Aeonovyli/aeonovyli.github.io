<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>

  <!-- Fonts & Libraries -->
  <link href="https://googleapis.com" rel="stylesheet">
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <link rel="stylesheet" href="/assets/css/style.css">

  <style>
    /* Fixed background that stays behind everything */
    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1; /* Moved to -1 to stay behind content */
      background-color: #050505;
    }

    /* This makes sure your GitHub Pages content is visible */
    .main-wrapper {
      position: relative;
      z-index: 10;
      color: white;
      min-height: 100vh;
      padding: 20px;
      font-family: 'Cormorant Garamond', serif;
    }
  </style>
</head>
<body>

  <!-- Dust Layer -->
  <div id="particles-js"></div>

  <!-- This is where your GitHub Pages content (index.md, etc) injects -->
  <div class="main-wrapper">
    {{ content }}
  </div>

  <!-- Particle Setup -->
  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 60 },
        color: { value: ["#4da6ff", "#ff944d", "#ffffff"] },
        opacity: { value: 0.4, random: true },
        size: { value: 2 },
        move: { speed: 0.5, direction: "top", out_mode: "out" }
