<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Main content -->
  {{ content }}

  <!-- Example nav links at bottom -->
  <nav class="nav">
    <a href="/page1">Interests</a>
    <a href="/page2">Page 2</a>
    <a href="/page3">Profiles</a>
    <a href="/page4">Eiriaoloth</a>
  </nav>

  <!-- =========================
       FLOATING RUNE SYSTEM
       ========================= -->
  <script>
    const runeSymbols = ["✧","✦","✶","✷","✹","✵","✸","✺"];

    // Create rune layer
    const layer = document.createElement("div");
    layer.className = "rune-layer";
    document.body.appendChild(layer);

    // Function to spawn rune
    function spawnRune(x, y, isCursor = false) {
      const rune = document.createElement("div");
      rune.className = "rune";
      rune.textContent = runeSymbols[Math.floor(Math.random() * runeSymbols.length)];

      rune.style.left = x + "px";
      rune.style.top = y + "px";

      const duration = isCursor ? 800 : 4000; // faster for cursor
      rune.style.animationDuration = duration + "ms";

      layer.appendChild(rune);

      setTimeout(() => rune.remove(), duration);
    }

    // Ambient runes floating randomly over the page
    setInterval(() => {
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight;
      spawnRune(x, y);
    }, 300);

    // Cursor-following runes
    document.addEventListener("mousemove", (e) => {
      const offsetX = (Math.random() - 0.5) * 20;
      const offsetY = (Math.random() - 0.5) * 20;
      spawnRune(e.clientX + offsetX, e.clientY + offsetY, true);
    });
  </script>

</body>
</html>
