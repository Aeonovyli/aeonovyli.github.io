<!DOCTYPE html>

    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    body {
      position: relative;
      z-index: 1;
      margin: 0;
    }
  </style>
</head>

  <!-- 1. Particle Background Script -->
  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 70 },
        size: { value: 2 },
        move: { speed: 0.3, direction: "top", random: true, out_mode: "out" },
        opacity: { value: 0.3, random: true },
        color: { value: ["#4da6ff", "#ff944d", "#ffffff"] },
        line_linked: { enable: false }
