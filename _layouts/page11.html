<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Cormorant+Garamond&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <script src="/assets/js/banner.js"></script>
  
  <link rel="stylesheet" href="/assets/css/style.css">

  <style>
    .kao-banner {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      z-index: 9999 !important;
      background: linear-gradient(180deg, #d32f2f 0%, #b71c1c 100%) !important;
      border-bottom: 4px solid #801313 !important;
      color: #ffffff !important;
      font-family: 'Arial Black', sans-serif !important;
      font-weight: 900 !important;
      text-transform: uppercase !important;
      letter-spacing: 2px !important;
      font-size: 1.5rem !important;
      text-align: center !important;
      text-shadow: 0px 1px 0px #9e1a1a, 0px 2px 0px #8a1515, 0px 3px 0px #751111, 0px 4px 0px #5e0d0d, 0px 6px 10px rgba(0,0,0,0.5) !important;
      padding: 0.5rem 2.5rem !important;
      line-height: 1.6 !important;
      box-sizing: border-box !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      gap: 10px !important;
    }

    .kao-banner a {
      color: #ffffff !important;
      text-decoration: none !important;
    }

    .kao-banner a:hover {
      text-decoration: underline !important;
    }

    .kao-countdown {
      color: #ffffff !important;
      font-weight: 900 !important;
    }

    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    body {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding-top: 70px; 
    }

    .content-area {
      position: relative;
      z-index: 2;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }
  </style>
</head>
<body>

  <div id="particles-js"></div>

  <div class="content-area">
    {{ content }}
  </div>

  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 150, density: { enable: true, value_area: 800 } },
        color: { value: ["#ffd700", "#00f3ff", "#ffffff"] },
        shape: { type: "circle" },
        opacity: { value: 0.5, random: true, anim: { enable: true, speed: 1, opacity_min: 0.1, sync: false } },
        size: { value: 2, random: true, anim: { enable: false, speed: 1, size_min: 0.1, sync: false } },
        line_linked: { enable: false, distance: 150, color: "#ffffff", opacity: 0.4, width: 1 },
        move: { enable: true, speed: 0.5, direction: "none", random: true, straight: false, out_mode: "out", bounce: false, attract: { enable: false, rotateX: 600, rotateY: 1200 } }
      },
      interactivity: {
        detect_on: "canvas",
        events: { onhover: { enable: false }, onclick: { enable: false }, resize: true },
        modes: {
          grab: { distance: 400, line_linked: { opacity: 1 } },
          bubble: { distance: 400, size: 40, duration: 2, opacity: 8, speed: 3 },
          repulse: { distance: 200, duration: 0.4 },
          push: { particles_nb: 4 },
          remove: { particles_nb: 2 }
        }
      },
      retina_detect: true
    });
  </script>
</body>
</html>
