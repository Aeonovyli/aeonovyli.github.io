<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messaging - The Silverstone</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
        .hidden { display: none; }
        textarea { width: 100%; height: 100px; margin-top: 10px; }
        button { cursor: pointer; padding: 8px 16px; margin-top: 10px; }
        #profile { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        #profile img { width: 32px; border-radius: 50%; }
    </style>
</head>
<body>

    <h1>Community Messaging</h1>

    <!-- Auth Section -->
    <div id="auth-section">
        <p>You must be logged in to post a message.</p>
        <button onclick="login()">Login with GitHub</button>
    </div>

    <!-- Posting Section (Hidden by default) -->
    <div id="post-section" class="hidden">
        <div id="profile"></div>
        <form id="message-form">
            <textarea id="message-content" placeholder="Write something..." required></textarea>
            <button type="submit" id="submit-btn">Post Message</button>
            <button type="button" onclick="logout()" style="background: none; border: none; color: gray; text-decoration: underline;">Logout</button>
        </form>
    </div>

    <script>
        // 1. Initialize Supabase
        const supabaseUrl = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsd2Jjcm1qZHVsYWVmaXloZGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MzU3NjksImV4cCI6MjA5MzAxMTc2OX0.zQDAVn4ZhW7QSC_WajxinnBHvg5Ry09xOZjxHOVMK2A'
        const supabase = supabase.createClient(supabaseUrl, supabaseKey)

        const authSection = document.getElementById('auth-section');
        const postSection = document.getElementById('post-section');
        const profileDiv = document.getElementById('profile');

        // 2. Check for User Session on Load
        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                showPostForm(session.user);
            } else {
                showLoginForm();
            }
        }

        function showPostForm(user) {
            authSection.classList.add('hidden');
            postSection.classList.remove('hidden');
            profileDiv.innerHTML = `
                <img src="${user.user_metadata.avatar_url}" alt="avatar">
                <span>Logged in as <strong>${user.user_metadata.full_name || user.email}</strong></span>
            `;
        }

        function showLoginForm() {
            authSection.classList.remove('hidden');
            postSection.classList.add('hidden');
        }

        // 3. Auth Actions
        async function login() {
            await supabase.auth.signInWithOAuth({ provider: 'github' });
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        // 4. Submit Message Logic
        document.getElementById('message-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('message-content').value;
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.disabled = true;
            submitBtn.innerText = 'Sending...';

            const { error } = await supabase
                .from('messages') // Make sure your table is named 'messages'
                .insert([{ content: content }]);

            if (error) {
                alert('Error posting message: ' + error.message);
            } else {
                alert('Message posted!');
                document.getElementById('message-content').value = '';
            }
            submitBtn.disabled = false;
            submitBtn.innerText = 'Post Message';
        });

        checkUser();
    </script>
</body>
</html>
