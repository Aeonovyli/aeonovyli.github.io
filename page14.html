<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Defender</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            user-select: none;
        }
        #gameCanvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffcc;
            pointer-events: none;
        }
        #input-area {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 2px;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }
        h1 {
            font-size: 70px;
            color: #ff4444;
            text-shadow: 0 0 20px #ff0000;
            margin: 0 0 20px 0;
        }
        p {
            font-size: 24px;
            color: #aaa;
        }
        button {
            padding: 15px 40px;
            font-size: 24px;
            background: #00ffcc;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
            box-shadow: 0 0 20px #00ffcc;
            transition: transform 0.1s;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

        const UI_LIVES = document.getElementById('lives');
        const UI_WAVE = document.getElementById('wave');

        const UI_FINAL_SCORE = document.getElementById('final-score');

        let width, height;
        let ships = [];
        let particles = [];
        let score = 0;
        let lives = 3;
        let wave = 1;
        let gameActive = false;
        let lastTime = 0;
        let spawnTimer = 0;
        let baseSpeed = 1.0;
        let spawnRate = 2000;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            CANVAS.width = width;
            CANVAS.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Ship {
            constructor(word) {
                this.word = word;
                this.x = Math.random() * (width - 100) + 50;
                this.y = -50;
                this.speed = baseSpeed + (Math.random() * 0.5);
                this.color = `hsl(${Math.random() * 60 + 320}, 100%, 60%)`;
                this.hp = word.length;
                this.maxHp = word.length;
                this.markedForDeletion = false;
                this.pulse = 0;
            }

            update(dt) {
                this.y += this.speed * (dt / 16);
                this.pulse += 0.1;
                if (this.y > height - 100) {
                    this.markedForDeletion = true;
                    takeDamage();
                }
            }

            draw() {
                const glowSize = 10 + Math.sin(this.pulse) * 5;
                CTX.shadowBlur = glowSize;
                CTX.shadowColor = this.color;
                CTX.fillStyle = this.color;
                CTX.beginPath();
                CTX.moveTo(this.x, this.y);
                CTX.lineTo(this.x - 15, this.y + 30);
                CTX.lineTo(this.x + 15, this.y + 30);
                CTX.closePath();
                CTX.fill();
                CTX.shadowBlur = 0;

                CTX.fillStyle = '#fff';
                CTX.font = 'bold 16px Courier New';
                CTX.textAlign = 'center';
                CTX.fillText(this.word, this.x, this.y - 10);
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 6 - 3;
                this.speedY = Math.random() * 6 - 3;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.02;
            }
            update() {
