<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Game | Aeonovyli's personal website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div id="score-board" style="display: none;">
            <div class="stat">SCORE: <span id="score-val">0</span></div>
            <div class="stat">LIVES: <span id="lives-val">3</span></div>
            <div class="stat">WAVE: <span id="wave-val">1</span></div>
        </div>
        <div id="input-display"></div>
        <div id="game-over-screen" style="display: none;">
            <h1>SYSTEM FAILURE</h1>
            <p>FINAL SCORE: <span id="final-score">0</span></p>
            <button id="restart-btn">REBOOT SYSTEM</button>
        </div>
    </div>
    <script src="starfield.js"></script>
    <script src="assets.js"></script>
    <script src="entities.js"></script>
    <script src="game.js"></script>
</body>
</html>
