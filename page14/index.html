<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Defender</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #fff; user-select: none; }
        #ui { position: absolute; top: 20px; left: 20px; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px #00ffcc; pointer-events: none; line-height: 1.6; }
        #input { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); font-size: 36px; color: #00ffcc; text-shadow: 0 0 20px #00ffcc; pointer-events: none; min-height: 40px; }
        #over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: none; background: rgba(0,0,0,0.9); padding: 40px; border: 2px solid #00ffcc; border-radius: 10px; box-shadow: 0 0 30px #00ffcc; }
        h1 { font-size: 60px; color: #ff4444; text-shadow: 0 0 20px #f00; margin: 0 0 20px 0; }
        button { padding: 15px 40px; font-size: 22px; background: #00ffcc; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; color: #000; box-shadow: 0 0 20px #00ffcc; margin-top: 20px; font-family: inherit; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 30px #00ffcc; }
    </style>
</head>
<body>
    <div id="ui">
        SCORE: <span id="s">0</span><br>
        LIVES: <span id="l">3</span><br>
        WAVE: <span id="w">1</span>
    </div>
    <div id="input"></div>
    <div id="over">
        <h1>CRITICAL FAILURE</h1>
        <p>FINAL SCORE: <span id="fs">0</span></p>
        <button onclick="reset()">REBOOT</button>
    </div>
    <canvas id="c"></canvas>
    <script>
        const C = document.getElementById('c');
        const X = C.getContext('2d');
        const UI_S = document.getElementById('s');
        const UI_L = document.getElementById('l');
        const UI_W = document.getElementById('w');
        const UI_IN = document.getElementById('input');
        const UI_OV = document.getElementById('over');
        const UI_FS = document.getElementById('fs');
        
        let W, H, ships = [], stars = [], parts = [], score = 0, lives = 3, wave = 1, running = false, last = 0, spawnT = 0, speedMult = 1.0;
        let wordList = [];
        let laserTimer = 0;
        let laserTarget = null;

        function initStars() {
            stars = [];
            for(let i=0; i<200; i++) {
                stars.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    z: Math.random() * 2 + 0.5,
                    s: Math.random() * 1.5 + 0.5
                });
            }
        }

        function fetchWords() {
            const w = new Set();
            const fetchWord = async (url) => {
                try {
                    const r = await fetch(url);
                    const t = await r.text();
                    const matches = t.match(/[a-z]{3,15}/g) || [];
                    matches.forEach(m => {
                        if (!m.includes('x') && !w.has(m)) w.add(m);
                    });
                } catch(e) { console.log('Fetch fallback'); }
            };
            const promises = [
                fetchWord('https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt'),
                fetchWord('https://raw.githubusercontent.com/first20hours/google-10000-english/master/20k.txt')
            ];
            Promise.all(promises).then(() => {
                wordList = Array.from(w);
                if (wordList.length === 0) wordList = ["ship", "star", "laser", "fleet", "orbit", "pulse", "blast", "target", "vector", "warp", "alien", "droid", "system", "grid", "flux", "zone", "nova", "cyber", "quantum", "matrix", "logic", "power", "energy", "shield", "armor", "battle", "combat", "attack", "defend", "destroy", "engage", "launch", "missile", "radar", "sonar", "sensor", "scan", "lock", "track", "guide", "aim", "fire", "boom", "crash", "burn", "fury", "storm", "wind", "cloud", "rain", "snow", "ice", "fire", "heat", "cold", "dark", "light", "bright", "dim", "glow", "shine", "spark", "flash", "beam", "ray", "ray", "ray", "ray"];
                startGame();
            });
        }

        function startGame() {
            W = window.innerWidth;
            H = window.innerHeight;
            C.width = W;
            C.height = H;
            initStars();
            ships = [];
            parts = [];
            score = 0;
            lives = 3;
            wave = 1;
            speedMult = 1.0;
            spawnT = 0;
            running = true;
            UI_OV.style.display = 'none';
            UI_S.innerText = score;
            UI_L.innerText = lives;
            UI_W.innerText = wave;
            last = performance.now();
            requestAnimationFrame(loop);
        }

        function reset() { startGame(); }

        class Star {
            constructor() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.z = Math.random() * 2 + 0.5;
                this.s = Math.random() * 1.5 + 0.5;
            }
            update(dt) {
                this.y += (this.z * 0.5) * (dt / 16) * speedMult;
                if (this.y > H) {
                    this.y = -10;
                    this.x = Math.random() * W;
                }
            }
            draw() {
                const alpha = this.z / 2.5;
                X.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                X.beginPath();
                X.arc(this.x, this.y, this.s, 0, Math.PI * 2);
                X.fill();
            }
        }

        class Particle {
            constructor(x, y, c) {
                this.x = x; this.y = y; this.c = c;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.02;
                this.size = Math.random() * 3 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.size *= 0.95;
            }
            draw() {
                X.globalAlpha = this.life;
                X.fillStyle = this.c;
                X.beginPath();
                X.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                X.fill();
                X.globalAlpha = 1.0;
            }
        }

        class Ship {
            constructor(w, parent = null) {
                this.word = w;
                this.parent = parent;
                this.x = parent ? parent.x : Math.random() * (W - 100) + 50;
                this.y = parent ? parent.y + 40 : -50;
                this.hp = w.length;
                this.maxHp = w.length;
                this.marked = false;
                this.color = parent ? '#00ffcc' : `hsl(${Math.random() * 60 + 320}, 100%, 60%)`;
                this.isCapital = w.length >= 5;
                this.size = this.isCapital ? 25 + (w.length * 2) : 15;
                this.speed = (parent ? 2.5 : 0.8) + (Math.random() * 0.4);
                if (!parent) this.speed *= speedMult;
                this.spawnTimer = 0;
            }

            update(dt) {
                if (!this.parent) this.y += this.speed * (dt / 16);
                if (this.y > H - 80 && !this.parent) {
                    this.marked = true;
                    takeHit();
                }
                if (this.isCapital && !this.parent && !this.spawned) {
                    this.spawnTimer += dt;
                    if (this.spawnTimer > 3000 && this.hp > 2) {
                        this.spawned = true;
                        const subW = wordList[Math.floor(Math.random() * wordList.length)];
                        ships.push(new Ship(subW, this));
                    }
                }
            }

            draw() {
                const glow = this.isCapital ? 20 : 10;
                X.shadowBlur = glow;
                X.shadowColor = this.color;
                X.fillStyle = this.color;
                
                if (this.isCapital) {
                    X.beginPath();
                    X.moveTo(this.x, this.y - this.size);
                    X.lineTo(this.x - this.size, this.y + this.size);
                    X.lineTo(this.x + this.size, this.y + this.size);
                    X.closePath();
                    X.fill();
                    X.fillStyle = '#fff';
                    X.font = `bold ${14 + (this.word.length * 2)}px Courier New`;
                    X.textAlign = 'center';
                    X.fillText(this.word, this.x, this.y + 5);
                } else {
                    X.beginPath();
                    X.moveTo(this.x, this.y);
                    X.lineTo(this.x - 10, this.y + 20);
                    X.lineTo(this.x + 10, this.y + 20);
                    X.closePath();
                    X.fill();
                    X.fillStyle = '#fff';
                    X.font = 'bold 14px Courier New';
                    X.textAlign = 'center';
                    X.fillText(this.word, this.x, this.y - 5);
                }
                X.shadowBlur = 0;
            }
        }

        function takeHit() { lives--; UI_L.innerText = lives; boom(W/2, H-80, '#00ffcc'); if(lives<=0) endGame(); }
        function boom(x, y, c) { for(let i=0; i<20; i++) parts.push(new Particle(x, y, c)); }
        function shoot(x1, y1, x2, y2) {
            X.strokeStyle = '#00ffcc';
            X.lineWidth = 3;
            X.shadowBlur = 10;
            X.shadowColor = '#00ffcc';
            X.beginPath();
            X.moveTo(x1, y1);
            X.lineTo(x2, y2);
            X.stroke();
            X.shadowBlur = 0;
        }

        function input(e) {
            if (!running) return;
            const k = e.key.toUpperCase();
            let t = null;
            let minD = Infinity;
            ships.forEach(s => {
                if (s.hp > 0) {
                    const idx = s.word.length - s.hp;
                    if (s.word[idx] === k) {
                        const d = Math.abs(s.y - (H - 100));
                        if (d < minD) { minD = d; t = s; }
                    }
                }
            });
            if (t) {
                t.hp--;
                const typed = t.word.substring(0, t.word.length - t.hp);
                UI_IN.innerText = typed + '_';
                laserTarget = t;
                laserTimer = 5;
                if (t.hp <= 0) {
                    t.marked = true;
                    boom(t.x, t.y, t.color);
                    score += t.word.length;
                    UI_S.innerText = score;
                    if (score > wave * 100) {
                        wave++;
                        speedMult += 0.1;
                        UI_W.innerText = wave;
                    }
                }
            }
        }

        function drawPlayer() {
            const cx = W / 2;
            const cy = H - 60;
            X.fillStyle = '#00ffcc';
            X.shadowBlur = 15;
            X.shadowColor = '#00ffcc';
            X.beginPath();
            X.moveTo(cx, cy - 15);
            X.lineTo(cx - 15, cy + 15);
            X.lineTo(cx + 15, cy + 15);
            X.closePath();
            X.fill();
            X.shadowBlur = 0;
            if (laserTimer > 0 && laserTarget && !laserTarget.marked) {
                shoot(cx, cy, laserTarget.x, laserTarget.y);
                laserTimer--;
            }
        }

        function loop(now) {
            if (!running) return;
            const dt = now - last;
            last = now;
            X.clearRect(0, 0, W, H);
            
            stars.forEach(s => { s.update(dt); s.draw(); });
            
            spawnT += dt;
            if (spawnT > Math.max(800, 2000 - wave * 100)) {
                const w = wordList[Math.floor(Math.random() * wordList.length)];
                ships.push(new Ship(w));
                spawnT = 0;
            }

            ships.forEach(s => { s.update(dt); s.draw(); });
            ships = ships.filter(s => !s.marked);
            
            parts.forEach((p, i) => {
                p.update();
                p.draw();
                if (p.life <= 0) parts.splice(i, 1);
            });

            drawPlayer();
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', () => { W = window.innerWidth; H = window.innerHeight; C.width = W; C.height = H; initStars(); });
        window.addEventListener('keydown', input);
        fetchWords();
    </script>
</body>
</html>
